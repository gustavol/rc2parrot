[platformio]
default_envs = esp32c3

; Flight build: the serial port turns off while PPM is active.
[env:esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
build_flags =
  ; native USB: Serial goes over USB without an adapter
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  ; internal logs off: only log.* writes to the serial port
  -DCORE_DEBUG_LEVEL=0
  -DCONFIG_NIMBLE_CPP_LOG_LEVEL=0
lib_deps = h2zero/NimBLE-Arduino@^2.1.0

; Bench setup build: console always on, also with the radio (key p = radio monitor).
; pio run -e esp32c3_console -t upload
[env:esp32c3_console]
extends = env:esp32c3
build_unflags = -DCONFIG_NIMBLE_CPP_LOG_LEVEL=0
build_flags =
  ${env:esp32c3.build_flags}
  -DFORCE_CONSOLE=1
  ; NimBLE errors only
  -DCONFIG_NIMBLE_CPP_LOG_LEVEL=1

; CRSF input instead of PPM (radio external module port, OpenI6X TX2 pad).
; pio run -e esp32c3_crsf -t upload
[env:esp32c3_crsf]
extends = env:esp32c3
build_flags =
  ${env:esp32c3.build_flags}
  -DINPUT_CRSF=1

; CRSF bench build.
[env:esp32c3_crsf_console]
extends = env:esp32c3_console
build_flags =
  ${env:esp32c3_console.build_flags}
  -DINPUT_CRSF=1

; Radio link test: CRSF bench build without the drone scan, radio monitor on from boot.
[env:esp32c3_crsf_test]
extends = env:esp32c3_crsf_console
build_flags =
  ${env:esp32c3_crsf_console.build_flags}
  -DNO_DRONE=1
