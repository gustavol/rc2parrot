[platformio]
default_envs = esp32c3

; Flight build: the serial port turns off while PPM is active.
[env:esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
build_flags =
  ; native USB: Serial goes over USB without an adapter
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  ; internal logs off: only log.* writes to the serial port
  -DCORE_DEBUG_LEVEL=0
  -DCONFIG_NIMBLE_CPP_LOG_LEVEL=0
lib_deps = h2zero/NimBLE-Arduino@^2.1.0

; Bench setup build: console always on, also with PPM (key p = PPM monitor).
; pio run -e esp32c3_console -t upload
[env:esp32c3_console]
extends = env:esp32c3
build_flags =
  ${env:esp32c3.build_flags}
  -DFORCE_CONSOLE=1
